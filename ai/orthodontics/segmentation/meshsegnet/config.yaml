# MeshSegNet — default hyperparameters
# CLI flags on any script override these values.

model:
  in_features: 9        # centroid(3) + normal(3) + log_area(1) + kappa1(1) + kappa2(1)
  num_classes: 17       # 0=gingiva, 1-16=teeth (same for upper and lower)
  k_neighbours: 6       # k-NN graph order for EdgeConv

training:
  epochs: 100
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_faces: 16000      # subsample meshes larger than this (memory / speed)
  ce_weight: 0.5        # CE fraction of combined CE + Dice loss
  num_workers: 4        # DataLoader workers (reduce to 0 on Windows)

data:
  train_frac: 0.80
  val_frac: 0.10
  # test_frac is implicitly 1 - train_frac - val_frac = 0.10
  seed: 42
